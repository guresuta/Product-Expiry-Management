<!DOCTYPE html>
<html lang="zh-Hant" class="app-booting">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#1f6feb">
  <title>商品效期趨勢分析 | 商品終期電馭監管裝置</title>
  <script src="./legacy-webview.js"></script>
  <script src="./background-loader.js"></script>
  <script src="./analytics-history.js"></script>
  <script>
    (() => {
      const root = document.documentElement;
      const themeKeys = new Set(["dark-1", "light-1", "light-2", "dark-2"]);
      const defaultThemeKey = "dark-1";
      const themeAliases = {
        "dark-7": "dark-1",
        "light-7": "light-1",
        "light-8": "light-2",
        "dark-8": "dark-2"
      };
      const savedTheme = localStorage.getItem("uiTheme") || defaultThemeKey;
      const normalizedTheme = themeAliases[savedTheme] || savedTheme;
      const themeKey = themeKeys.has(normalizedTheme) ? normalizedTheme : defaultThemeKey;
      if (themeKey !== savedTheme) {
        localStorage.setItem("uiTheme", themeKey);
      }
      const statusBarColors = {
        "dark-1": "#050505",
        "light-1": "#fafafa",
        "light-2": "#f4f7f5",
        "dark-2": "#101814"
      };
      const languageKeys = new Set(["zh-Hant", "en", "ja"]);
      const inferSystemLanguage = () => {
        const candidates = [];
        if (Array.isArray(navigator.languages)) candidates.push.apply(candidates, navigator.languages);
        candidates.push(navigator.language || navigator.userLanguage || "");
        const normalized = candidates.map((item) => String(item || "").toLowerCase()).filter(Boolean);
        if (normalized.some((item) => item.startsWith("zh"))) return "zh-Hant";
        if (normalized.some((item) => item.startsWith("ja"))) return "ja";
        return "en";
      };
      const savedLanguage = localStorage.getItem("appLanguage");
      const language = savedLanguage && languageKeys.has(savedLanguage) ? savedLanguage : inferSystemLanguage();
      const bootStartedAt = Date.now();
      const minBootDurationMs = window.AndroidBridge ? 280 : 360;
      const maxBootDurationMs = window.AndroidBridge ? 1500 : 2000;
      let ready = false;
      let bootVisualReady = false;
      let androidNavigationPending = false;
      const prepareAndroidTransitionCover = (event) => {
        if (!window.AndroidBridge || typeof window.AndroidBridge.prepareTransitionCover !== "function") return;
        let node = event.target;
        while (node && node !== document && String(node.tagName || "").toUpperCase() !== "A") {
          node = node.parentNode;
        }
        if (!node || node === document || node.target === "_blank") return;
        const href = node.getAttribute("href") || "";
        if (!/^(?:\.\/)?(?:inventory-management-app|settings|analytics|privacy-policy)\.html(?:[?#].*)?$/.test(href)) return;
        event.preventDefault();
        if (androidNavigationPending) return;
        androidNavigationPending = true;
        try {
          window.AndroidBridge.prepareTransitionCover();
        } catch (_error) {
        }
        window.setTimeout(() => {
          window.location.href = href;
        }, 32);
      };
      document.addEventListener("click", prepareAndroidTransitionCover, true);
      root.setAttribute("data-theme", themeKey);
      root.setAttribute("lang", language);
      if (window.AndroidBridge) {
        root.classList.add("android-webview");
      }
      try {
        if (window.AndroidBridge && typeof window.AndroidBridge.setStatusBarColor === "function") {
          window.AndroidBridge.setStatusBarColor(statusBarColors[themeKey] || statusBarColors[defaultThemeKey]);
        }
      } catch (_error) {
      }
      const markBootVisualReady = () => {
        if (bootVisualReady) return;
        bootVisualReady = true;
        root.classList.add("app-boot-visual-ready");
      };
      if (window.AppBackground && typeof window.AppBackground.start === "function") {
        window.AppBackground.start(themeKey);
      }
      markBootVisualReady();
      window.AppBoot = {
        ready() {
          if (ready) return;
          ready = true;
          const finish = () => {
            root.classList.remove("app-booting");
            root.classList.add("app-ready");
            requestAnimationFrame(() => requestAnimationFrame(() => {
              try {
                if (window.AndroidBridge && typeof window.AndroidBridge.notifyPageBootReady === "function") {
                  window.AndroidBridge.notifyPageBootReady();
                }
              } catch (_error) {
              }
            }));
            setTimeout(() => {
              const bootScreen = document.querySelector(".app-boot-screen");
              if (bootScreen) bootScreen.remove();
            }, 240);
          };
const waitForFinish = () => {
            const elapsed = Date.now() - bootStartedAt;
            const minDelay = Math.max(0, minBootDurationMs - elapsed);
            if (minDelay > 0) {
              setTimeout(waitForFinish, minDelay);
              return;
            }
            if (!bootVisualReady && elapsed < maxBootDurationMs) {
              setTimeout(waitForFinish, 50);
              return;
            }
            finish();
          };
          waitForFinish();
        }
      };
      setTimeout(() => window.AppBoot.ready(), maxBootDurationMs);
    })();
  </script>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-app-192.png">
  <link rel="stylesheet" href="./styles_washi.css">
  <script src="./resource-preload.js" defer></script>
</head>
<body>
  <div class="app-background-layer" aria-hidden="true"></div>
  <div class="app-boot-screen" aria-hidden="true">
    <div class="app-boot-spinner"></div>
  </div>
  <header class="topbar">
    <div class="container topbar-inner">
      <div>
        <h1>商品效期趨勢分析</h1>
        <p class="subtitle">- 依照目前商品資料即時計算效期與過期比例 -</p>
      </div>
      <nav class="actions settings-nav-actions">
        <button id="analyticsExportJsonBtn" class="btn secondary nav-link transient-nav-btn" type="button">備 份 資 料 J S O N</button>
        <a class="btn secondary nav-link settings-back-link" href="./inventory-management-app.html">商 品</a>
      </nav>
    </div>
  </header>

  <main class="container layout settings-main analytics-main">
    <section class="panel settings-section analytics-section">
      <h2 class="section-title-bar">商品效期概況</h2>
      <p id="analyticsFallbackNotice" class="help-text analytics-warning hidden">目前無法讀取本機 JSON 檔案，已暫時使用 IndexedDB 備援資料。請回設定頁重新選擇資料檔。</p>
      <p id="backupOverview" class="analytics-summary analytics-backup-summary">讀取中</p>
      <div id="overviewMetrics" class="analytics-overview-grid" aria-live="polite"></div>
    </section>

    <section class="panel settings-section analytics-section">
      <h2 class="section-title-bar">分類商品數量分布</h2>
      <div class="analytics-list-table-wrap">
        <table class="analytics-list-table">
          <thead>
            <tr>
              <th>商品類別</th>
              <th>商品筆數</th>
            </tr>
          </thead>
          <tbody id="categoryCountBody"></tbody>
        </table>
      </div>
    </section>

    <section class="panel settings-section analytics-section">
      <h2 class="section-title-bar">到期日時間分布趨勢</h2>
      <div id="expiryHeatmap" class="analytics-heatmap" aria-label="到期日時間分布趨勢"></div>
    </section>

    <section class="panel settings-section analytics-section">
      <h2 class="section-title-bar">分類商品過期比例</h2>
      <div class="analytics-list-table-wrap">
        <table class="analytics-list-table analytics-expired-ratio-table">
          <thead>
            <tr>
              <th>分類</th>
              <th>筆數</th>
              <th>過期數</th>
              <th>比例</th>
            </tr>
          </thead>
          <tbody id="categoryRiskBody"></tbody>
        </table>
      </div>
    </section>

    <section class="panel settings-section analytics-section">
      <h2 class="section-title-bar">歷史過期趨勢</h2>
      <div class="analytics-list-table-wrap">
        <table class="analytics-list-table analytics-history-table">
          <thead><tr><th>月份</th><th>過期數</th><th>過期率</th></tr></thead>
          <tbody id="monthlyExpiryHistoryBody"></tbody>
        </table>
      </div>
    </section>

    <section class="panel settings-section analytics-section">
      <h2 class="section-title-bar">分類歷史過期統計</h2>
      <div class="analytics-list-table-wrap">
        <table class="analytics-list-table analytics-history-category-table">
          <thead><tr><th>分類</th><th>新增數</th><th>過期數</th><th>刪除數</th></tr></thead>
          <tbody id="categoryHistoryBody"></tbody>
        </table>
      </div>
    </section>
    <section class="panel settings-section analytics-section">
      <h2 class="section-title-bar">平均剩餘效期分析</h2>
      <div class="analytics-list-table-wrap">
        <table class="analytics-list-table">
          <thead>
            <tr>
              <th>商品類別</th>
              <th>平均效期天數</th>
            </tr>
          </thead>
          <tbody id="averageDaysBody"></tbody>
        </table>
      </div>
    </section>
  </main>

  <div id="toast" class="toast hidden"></div>
  <script src="./i18n.js" defer></script>
  <script src="./version.js" defer></script>
  <script src="./analytics.js" defer></script>
</body>
</html>
