name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: https://guresuta.github.io/Product-Expiry-Management/
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Prepare Pages artifact
        run: |
          mkdir -p pages-dist/icons pages-dist/fonts pages-dist/key-visuals
          cp inventory-management-app.html settings.html privacy-policy.html analytics.html index.html pages-dist/
          cp styles_washi.css legacy-webview.js resource-preload.js data-store.js app.js settings.js analytics.js i18n.js version.js sw.js manifest.webmanifest favicon.ico pages-dist/
          cp icons/icon-app-192.png icons/icon-app-512.png icons/icon-app-maskable-192.png icons/icon-app-maskable-512.png pages-dist/icons/
          cp fonts/GenSekiGothic2TC-H.woff2 fonts/GenSekiGothic2TC-R.woff2 pages-dist/fonts/
          cp key-visuals/background-neon-cyber.png key-visuals/background-daylight-cyber.png key-visuals/background-vibrant-oasis.png key-visuals/background-midnight-oasis.png pages-dist/key-visuals/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "pages-dist"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true

      - name: Verify GitHub Pages deployment
        run: |
          expected_cache="$(sed -n 's/^const CACHE_NAME = "\(.*\)";/\1/p' pages-dist/sw.js)"
          if [ -z "$expected_cache" ]; then
            echo "Unable to read expected cache name from pages-dist/sw.js"
            exit 1
          fi
          for attempt in $(seq 1 12); do
            body="$(curl -fsSL "https://guresuta.github.io/Product-Expiry-Management/sw.js?verify=${GITHUB_SHA}-${attempt}" || true)"
            if echo "$body" | grep -Fq "$expected_cache"; then
              echo "Verified GitHub Pages cache: $expected_cache"
              exit 0
            fi
            echo "Waiting for GitHub Pages to serve $expected_cache (attempt $attempt/12)"
            sleep 10
          done
          echo "GitHub Pages did not serve expected cache: $expected_cache"
          exit 1
